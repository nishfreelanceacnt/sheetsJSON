services:
  - type: web
    name: sheetsjson
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: KEY_AUTO_ISSUE
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: KEYS_BACKEND
        value: db
      - key: DATABASE_URL
        fromDatabase:
          name: sheetsjson-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: sheetsjson-db
    plan: free
